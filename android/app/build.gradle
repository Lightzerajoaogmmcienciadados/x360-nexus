plugins { id 'com.android.application' }
android {
    namespace 'com.x360nexus'
    compileSdk 35
    defaultConfig {
        applicationId 'com.x360nexus'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '10.0-native-experimental'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
