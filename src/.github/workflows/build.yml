
name: Build X360 Nexus

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Compilar EXE
        run: cargo build --release

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-Windows
          path: target/release/x360-nexus.exe
