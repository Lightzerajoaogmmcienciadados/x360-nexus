name: X360 Nexus Native Android 10.0 - Mali Xenia launcher
on:
  push:
    branches:
      - feature/x360-nexus-native-v10.0
    paths:
      - 'android/**'
      - 'core/**'
      - '.github/workflows/x360-native-android-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-apk:
    name: Build native X360 Nexus 10.0 Mali launcher APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rust aarch64 Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: SDK e NDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          NDK_VERSION="$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n1)"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Testar unidade CPU, GPU, kernel, loader
        run: cargo test --manifest-path core/Cargo.toml --all-targets

      - name: Compilar biblioteca Rust Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo build --manifest-path core/Cargo.toml --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp core/target/aarch64-linux-android/release/libx360nexus.so android/app/src/main/jniLibs/arm64-v8a/
          test -s android/app/src/main/jniLibs/arm64-v8a/libx360nexus.so

      - name: Compilar APK NATIVO sem WebView
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Validar pacote Android
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'lib/arm64-v8a/libx360nexus.so'
          sha256sum "$APK"

      - name: APK para download
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-v10.0-Xenia-Mali-Launcher-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
