name: X360 Nexus v5.7 continuous PPC sparse RAM PM4 GLES Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/x360-galaxy-v5.7-continuous-cpu-gles
    paths:
      - '.github/workflows/build-x360-android-apk.yml'
      - 'android/**'
      - 'core/**'
      - 'tests/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-apk:
    name: Compile v5.7 ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK, CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rust stable Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Native C++ XDVDFS + XEX2 tests (host)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/xdvdfs-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/xdvdfs-host --parallel 2
          ctest --test-dir build/xdvdfs-host --output-on-failure

      - name: Rust CPU/kernel tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build ARM64 Rust JNI
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          cargo build --manifest-path core/Cargo.toml --release --target aarch64-linux-android
          install -Dm755 core/target/aarch64-linux-android/release/libx360nexus.so android/app/src/main/jniLibs/arm64-v8a/libx360nexus.so

      - name: Gradle APK with C++ XEX2 JNI and Kotlin UI
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Validate APK ARM64 libraries
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libx360nexus.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libx360xdvdfs.so'
          sha256sum "$APK" > apk-sha256.txt
          ls -lh "$APK"

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-v5.7-Android-ARM64-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-v5.7-Android-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7