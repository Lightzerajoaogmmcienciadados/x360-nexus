name: Build X360 Nexus Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-x360-android-apk.yml'
      - 'android/**'
      - 'core/**'

permissions:
  contents: read

jobs:
  android-apk:
    name: Android ARM64 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rust stable + Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Test Rust core
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build Rust JNI ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          test -x "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          cargo build --manifest-path core/Cargo.toml --target aarch64-linux-android --release
          install -Dm755 core/target/aarch64-linux-android/release/libx360nexus.so android/app/src/main/jniLibs/arm64-v8a/libx360nexus.so

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK file
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-Android-ARM64-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
