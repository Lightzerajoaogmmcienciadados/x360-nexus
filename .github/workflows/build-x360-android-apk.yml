name: X360 Nexus Android Debug APK (Rust)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-x360-android-apk.yml'
      - 'android/**'
      - 'core/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-x360-android-apk.yml'
      - 'android/**'
      - 'core/**'

permissions:
  contents: read

jobs:
  android-apk:
    name: Compile and verify ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted ubuntu runners already provide command-line tools.
          # setup-android@v3 may attempt to install removed SDK package "tools".
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Run Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/Cargo.toml

      - name: Build Rust JNI library for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          cargo build --manifest-path core/Cargo.toml --target aarch64-linux-android --release
          install -Dm755 core/target/aarch64-linux-android/release/libx360nexus.so android/app/src/main/jniLibs/arm64-v8a/libx360nexus.so

      - name: Build Android debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify APK contains ARM64 library
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libx360nexus.so"
          ls -lh "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-Rust-Android-ARM64-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-Android-Build-Logs
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
