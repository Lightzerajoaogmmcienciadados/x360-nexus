name: X360 Nexus v0.3 - APK Android Web
on:
  workflow_dispatch:
  push:
    branches:
      - build/x360-nexus-v0-3-android-apk-20261111
    paths:
      - "android-web/**"
      - "docs/index.html"
      - ".github/workflows/android-web-v0.3.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar X360 Nexus Web v0.3 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configurar Android SDK do runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Copiar interface web offline original
        shell: bash
        run: |
          mkdir -p android-web/app/src/main/assets
          cp docs/index.html android-web/app/src/main/assets/index.html
          test -s android-web/app/src/main/assets/index.html
      - name: Compilar APK
        working-directory: android-web
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace
      - name: Verificar APK
        shell: bash
        run: |
          set -e
          APK=android-web/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-Web-v0.3-Android-APK
          path: android-web/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
