name: WiFiNova Android APK (SDK 35)
on:
  push:
    branches:
      - wifinova-v2-android-build
    paths:
      - 'wifinova/**'
      - '.github/workflows/wifinova-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK 35 e build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar WiFiNova APK
        working-directory: wifinova/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar arquivo APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiNova-v2-Android-APK
          path: wifinova/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
