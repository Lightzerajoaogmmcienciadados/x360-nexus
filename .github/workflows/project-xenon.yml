name: X360 Nexus v0.6 Project Xenon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/project-xenon-v0.6

      - name: Criar estrutura v0.6
        run: |
          mkdir -p docs
          cat > docs/PROJECT_XENON_V06.md <<'EOF'
          # X360 Nexus v0.6 — Project Xenon

          Protótipo experimental em Rust.

          ## Desenvolvimento
          - CPU PowerPC
          - GPU experimental
          - Kernel
          - Audio
          - Controles
          - APK Android

          Jogos comerciais ainda não são suportados.
          EOF

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_XENON_V06.md
          if ! git diff --cached --quiet; then
            git commit -m "Initialize Project Xenon v0.6"
            git push origin HEAD:feature/project-xenon-v0.6
          fi
