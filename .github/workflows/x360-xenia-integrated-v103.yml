name: X360 Nexus v10.3 - Xenia Mali game execution and performance
on:
  push:
    branches:
      - feature/x360-nexus-xenia-integrated-v10.3
    paths:
      - 'android/**'
      - 'core/**'
      - 'tools/build_xenia_integrated.py'
      - 'licenses/**'
      - '.github/workflows/x360-xenia-integrated-v103.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xenia-mali-in-one-apk:
    name: Build X360 Nexus + bundled Xenia Mali ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout X360 Nexus
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rust Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          NDK_VERSION="$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n1)"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Test X360 Nexus Rust
        run: cargo test --manifest-path core/Cargo.toml --all-targets

      - name: Build X360 Nexus Rust ARM64 and native Android frontend
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo build --manifest-path core/Cargo.toml --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp core/target/aarch64-linux-android/release/libx360nexus.so android/app/src/main/jniLibs/arm64-v8a/
          cd android
          gradle :app:assembleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Fetch pinned upstream XenDroid Mali q664 (BSD-3) and Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integrate/out
          curl --retry 4 --retry-all-errors -fL \
            'https://github.com/DEGROUCHO/xendroid-mali/releases/download/q664/xendroid-mali-q664.apk' \
            -o integrate/xendroid-mali-q664.apk
          echo '77e89239a55d8909e0572fbe4edaa367d2276384663e6584689f85857a97d66f  integrate/xendroid-mali-q664.apk' | sha256sum -c -
          curl --retry 4 --retry-all-errors -fL \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
            -o integrate/apktool.jar
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  integrate/apktool.jar' | sha256sum -c -
          unzip -l integrate/xendroid-mali-q664.apk | grep 'lib/arm64-v8a/libe.so'

      - name: Decode resources of Xenia Mali host without altering native bytecode
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx3g -jar integrate/apktool.jar d -s -f \
            integrate/xendroid-mali-q664.apk -o integrate/decoded

      - name: Add Nexus launcher, Rust library and notices to Xenia APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_xenia_integrated.py \
            --upstream integrate/xendroid-mali-q664.apk \
            --nexus android/app/build/outputs/apk/debug/app-debug.apk \
            --decoded integrate/decoded \
            --license licenses/XENDROID_MALI_BSD_3_CLAUSE.txt

      - name: Rebuild one integrated Android APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx3g -jar integrate/apktool.jar b integrate/decoded \
            -o integrate/out/x360-nexus-xenia-unsigned.apk

      - name: Align and sign integrated APK with local development key
        shell: bash
        run: |
          set -euo pipefail
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_TOOLS/zipalign" -p -f 4 \
            integrate/out/x360-nexus-xenia-unsigned.apk \
            integrate/out/x360-nexus-xenia-aligned.apk
          keytool -genkeypair -noprompt -keystore integrate/out/debug.keystore \
            -alias x360nexus -storepass android -keypass android -keyalg RSA \
            -keysize 2048 -validity 7300 \
            -dname 'CN=X360 Nexus Xenia Mali, O=Community Emulator Research, C=BR'
          "$SDK_TOOLS/apksigner" sign \
            --ks integrate/out/debug.keystore --ks-key-alias x360nexus \
            --ks-pass pass:android --key-pass pass:android \
            --out integrate/out/X360-Nexus-v10.3-Xenia-Mali-Desempenho.apk \
            integrate/out/x360-nexus-xenia-aligned.apk
          "$SDK_TOOLS/apksigner" verify --verbose \
            integrate/out/X360-Nexus-v10.3-Xenia-Mali-Desempenho.apk
          rm -f integrate/out/debug.keystore

      - name: Validate Xenia engine and both Android runtimes
        shell: bash
        run: |
          set -euo pipefail
          APK=integrate/out/X360-Nexus-v10.3-Xenia-Mali-Desempenho.apk
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'lib/arm64-v8a/libe.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libx360nexus.so'
          unzip -l "$APK" | grep 'assets/X360_NEXUS_XENIA_ENGINE_NOTICES.txt'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee integrate/out/package-details.txt
          grep -q "com.x360nexus.MainActivity" integrate/out/package-details.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" \
            | grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE'
          sha256sum "$APK"

      - name: Upload real Xenia Mali integrated APK (single app)
        uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-v10.3-Xenia-Mali-Integrated-Android-APK
          path: integrate/out/X360-Nexus-v10.3-Xenia-Mali-Desempenho.apk
          if-no-files-found: error
          retention-days: 90
