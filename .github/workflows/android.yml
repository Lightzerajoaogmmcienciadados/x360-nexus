name: Project Xenon Galaxy Android
on:
  push:
    branches:
      - feature/project-xenon-v4.1-galaxy
      - feature/project-xenon-v4.0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Build native library
        shell: bash
        run: |
          set -e
          NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo build --manifest-path core/Cargo.toml --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp core/target/aarch64-linux-android/release/libx360nexus.so android/app/src/main/jniLibs/arm64-v8a/
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Xenon-4.1-Galaxy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
