
name: Project Xenon 4.1 Galaxy Android

on:
  push:
    branches:
      - main
      - feature/project-xenon-v0.6
      - feature/project-xenon-v4.0
      - feature/project-xenon-v4.1-galaxy

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Project Xenon 4.1 Galaxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Test Rust core
        run: |
          cargo test --manifest-path core/Cargo.toml

      - name: Compile Rust Android ARM64
        shell: bash
        run: |
          set -e

          rustup target add aarch64-linux-android

          NDK="$ANDROID_HOME/ndk"
          NDK_VERSION=$(ls "$NDK" | sort -V | tail -1)

          TOOLCHAIN="$NDK/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$TOOLCHAIN"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"

          cargo build \
            --manifest-path core/Cargo.toml \
            --target aarch64-linux-android \
            --release

          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          cp \
            core/target/aarch64-linux-android/release/libx360nexus.so \
            android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload Galaxy APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Xenon-4.1-Galaxy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
