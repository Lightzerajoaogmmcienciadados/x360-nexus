name: X360 Nexus Android 0.5
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'core/**'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        with:
          gradle-version: '8.10.2'
        run: sdkmanager 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Test Rust core
        run: cargo test --manifest-path core/Cargo.toml
      - name: Compile Rust JNI for Android ARM64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs --manifest-path core/Cargo.toml build --release
      - name: Build Android APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: X360-Nexus-Android-0.5-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
