[package]
name = "x360-galaxy-windows"
version = "5.8.0"
edition = "2021"
autolib = false

[[bin]]
name = "x360-galaxy"
path = "src/main.rs"

[dependencies]
x360nexus = { package = "x360-nexus-core", path = "core" }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15.3"
